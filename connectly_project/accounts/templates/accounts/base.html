<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Django App{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

    <nav class="bg-blue-600 p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-white text-lg font-bold">My App</a>
            <div>
                {% if request.user.is_authenticated %}
                    {% if request.user.is_admin %}
                        <a href="{% url 'admin_dashboard' %}" class="text-white mr-4">Admin Dashboard</a>
                    {% else %}
                        <a href="{% url 'user_dashboard' %}" class="text-white mr-4">User Dashboard</a>
                    {% endif %}
                    <a href="{% url 'account_logout' %}" class="bg-red-500 text-white px-4 py-2 rounded">Logout</a>
                {% else %}
                    <a href="{% url 'account_login' %}" class="bg-green-500 text-white px-4 py-2 rounded">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-10 p-6">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
